<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Çocuk Oyunları</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--night:#1a1230;--lantern:#ffc857;--lantern-deep:#b7791f;--ink:#3a2300;--text:#f6f0ff;--muted:#c0b3e4;color-scheme:dark}
*{box-sizing:border-box}
body{
  margin:0;min-height:100dvh;display:flex;justify-content:center;
  font-family:'Fredoka',ui-rounded,'Segoe UI',system-ui,sans-serif;color:var(--text);
  background:radial-gradient(120% 55% at 50% -8%,rgba(255,200,87,.22),transparent 62%),var(--night);
}
main{width:100%;max-width:520px;padding:40px 16px}
h1{margin:0 0 6px;font-size:36px;line-height:1.1;color:var(--lantern)}
p.lead{margin:0 0 26px;font-size:18px;color:var(--muted)}
a.game{
  display:block;padding:18px 20px;border-radius:22px;text-decoration:none;
  background:var(--lantern);color:var(--ink);box-shadow:0 4px 0 var(--lantern-deep);
}
a.game:focus-visible{outline:3px solid #5eead4;outline-offset:3px}
a.game b{display:block;font-size:24px;line-height:1.15}
a.game span{display:block;margin-top:4px;font-size:16px;line-height:1.3}
p.soon{margin:22px 0 0;font-size:15px;color:var(--muted)}
</style>
</head>
<body>
<main>
  <h1>Çocuk Oyunları</h1>
  <p class="lead">Bir oyun seç ve oynamaya başla.</p>
  <a class="game" href="hazine-madeni/">
    <b>Hazine Madeni</b>
    <span>Usta Kıvırcık'la kaz, taşları tanı, hazine avına çık.</span>
  </a>
  <p class="soon">Yeni oyunlar yakında.</p>
</main>
</body>
</html>
